services:
  web:
    build: .
    container_name: tecnova-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      PORT: "5050"
    ports:
      - "5050:5050"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: tecnova-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: